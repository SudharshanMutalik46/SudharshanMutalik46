<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Sudharshan Mutalik cloud terminal banner</title>
  <desc id="desc">A dark terminal-inspired banner for an AWS, Linux, and DevOps engineer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131a"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5c4"/>
      <stop offset="1" stop-color="#ff9900"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#16303a" stroke-width="1" opacity=".45"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <rect x="20" y="20" width="1160" height="280" rx="16" fill="none" stroke="#263d47"/>
  <path d="M20 72H1180" stroke="#263d47"/>
  <circle cx="50" cy="46" r="7" fill="#ff5f56"/>
  <circle cx="74" cy="46" r="7" fill="#ffbd2e"/>
  <circle cx="98" cy="46" r="7" fill="#27c93f"/>
  <text x="126" y="52" fill="#6f8792" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">cloud-shell — profile</text>

  <g transform="translate(78 102)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="0" y="28" fill="#00e5c4" font-size="20">sudharshan@aws:~$</text>
    <text x="236" y="28" fill="#e6edf3" font-size="20">whoami</text>
    <text x="0" y="82" fill="#ffffff" font-size="42" font-weight="700" letter-spacing="1.2">SUDHARSHAN MUTALIK</text>
    <rect x="0" y="105" width="565" height="4" rx="2" fill="url(#line)" filter="url(#glow)"/>
    <text x="0" y="148" fill="#9fb4bd" font-size="20">AWS CLOUD  •  LINUX  •  DEVOPS</text>
    <text x="0" y="190" fill="#ff9900" font-size="17">$ build reliable systems</text>
    <rect x="260" y="174" width="11" height="20" rx="1" fill="#00e5c4">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(860 98)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 125H212c35 0 48-44 21-63-8-6-18-9-28-8-9-34-40-56-75-51-27 4-49 24-57 50-28-4-53 17-53 45 0 15 9 27 24 27Z" stroke="#00e5c4" stroke-width="5" filter="url(#glow)"/>
    <path d="M90 125v38m44-38v67m44-67v38" stroke="#6f8792" stroke-width="3"/>
    <circle cx="90" cy="174" r="10" stroke="#ff9900" stroke-width="4"/>
    <circle cx="134" cy="204" r="10" stroke="#00e5c4" stroke-width="4"/>
    <circle cx="178" cy="174" r="10" stroke="#ff9900" stroke-width="4"/>
    <path d="M106 174h16m24 0h16M134 163v-20" stroke="#6f8792" stroke-width="3"/>
    <rect x="120" y="92" width="28" height="28" rx="5" stroke="#ff9900" stroke-width="4"/>
    <path d="M126 106h16" stroke="#ff9900" stroke-width="3"/>
  </g>
</svg>
